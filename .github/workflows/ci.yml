name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the build on a known HIGH/critical advisory in a production
      # dependency (dev/build tooling does not block the app). Runs through
      # scripts/audit-gate.mjs, which allowlists individually-justified
      # advisories that provably cannot apply to this app.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      - name: Lint
        run: npm run lint

      # Coverage floors live in vitest.config.js; a drop below them fails here.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
